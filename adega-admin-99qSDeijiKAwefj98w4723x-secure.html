<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ PAINEL ADMINISTRATIVO - BOLÃO DO JACIM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-3 md:p-6 antialiased">

    <main class="max-w-4xl mx-auto space-y-6">
        
        <div class="bg-gradient-to-r from-red-950/40 to-slate-900 border border-red-900/60 p-4 md:p-5 rounded-2xl shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-base md:text-lg font-black text-red-400 uppercase tracking-wider">⚙️ Gestão Secreta - Bolão do Jacim</h1>
                <p class="text-xs text-slate-400 mt-0.5">Lançamento de apostas, rateio de caixas e auditoria interna.</p>
            </div>
            <button onclick="carregarDados()" class="w-full sm:w-auto text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2.5 sm:py-1.5 rounded-xl font-bold transition">🔄 Atualizar Banco</button>
        </div>

        <div class="bg-slate-900 p-4 md:p-5 rounded-2xl border border-slate-800 shadow-xl space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Abrir Novo Mercado de Jogo:</h3>
            <div class="flex flex-col gap-2.5 sm:grid sm:grid-cols-4">
                <input type="text" id="add-time-a" placeholder="Time A" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-red-500">
                <input type="text" id="add-time-b" placeholder="Time B" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-red-500">
                <input type="datetime-local" id="add-data" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-white focus:outline-none focus:border-red-500">
                <button onclick="cadastrarJogo()" class="w-full bg-red-600 hover:bg-red-500 text-white p-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition mt-1 sm:mt-0">Criar Novo Bolão</button>
            </div>
        </div>

        <div class="flex gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800 overflow-x-auto">
            <button onclick="filtrarJogos('todos')" id="btn-filtro-todos" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shrink-0">Todos</button>
            <button onclick="filtrarJogos('abertos')" id="btn-filtro-abertos" class="bg-slate-950 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shrink-0">Abertos</button>
            <button onclick="filtrarJogos('finalizados')" id="btn-filtro-finalizados" class="bg-slate-950 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shrink-0">Finalizados</button>
        </div>

        <div class="space-y-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Controle por Partida Comercial</h2>
            <div id="lista-jogos-admin" class="space-y-5"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://vjbjbjdqsjibxfeguger.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IsntZwbiFHOs3RuhFnFs6g_8xA6-z-2";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cacheJogos = [];
        let cachePalpites = [];
        let filtroAtual = 'todos';

        async function carregarDados() {
            const { data: jogos } = await _supabase.from('jogos').select('*').order('data_jogo', { ascending: true });
            const { data: palpites } = await _supabase.from('palpites').select('*');
            if (!jogos || !palpites) return;

            cacheJogos = jogos;
            cachePalpites = palpites;
            
            // PROTEÇÃO CONTRA SUMIÇO DE LETRAS: Só atualiza a tela se o usuário não estiver digitando nada!
            if (document.activeElement.tagName !== 'INPUT') {
                renderizarJogos();
            }
        }

        function filtrarJogos(tipo) {
            filtroAtual = tipo;
            ['todos', 'abertos', 'finalizados'].forEach(t => {
                const btn = document.getElementById(`btn-filtro-${t}`);
                if (t === tipo) {
                    btn.className = "bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shrink-0";
                } else {
                    btn.className = "bg-slate-950 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-lg cursor-pointer transition shrink-0";
                }
            });
            renderizarJogos();
        }

        function renderizarJogos() {
            const adminDiv = document.getElementById('lista-jogos-admin');
            
            // Salva os valores que você já digitou antes de recarregar a tela (Garante dupla proteção)
            const valoresPreenchidos = {};
            cacheJogos.forEach(j => {
                const campoNome = document.getElementById(`whats-nome-${j.id}`);
                const campoA = document.getElementById(`whats-pal-a-${j.id}`);
                const campoB = document.getElementById(`whats-pal-b-${j.id}`);
                if (campoNome) {
                    valoresPreenchidos[j.id] = {
                        nome: campoNome.value,
                        palA: campoA.value,
                        palB: campoB.value
                    };
                }
            });

            adminDiv.innerHTML = '';

            let jogosFiltrados = cacheJogos;
            if (filtroAtual === 'abertos') jogosFiltrados = cacheJogos.filter(j => !j.encerrado);
            if (filtroAtual === 'finalizados') jogosFiltrados = cacheJogos.filter(j => j.encerrado);

            if (jogosFiltrados.length === 0) {
                adminDiv.innerHTML = `<div class="text-center py-8 text-xs text-slate-600 italic border border-dashed border-slate-800 rounded-2xl">Nenhum bolão encontrado nesse filtro.</div>`;
                return;
            }

            jogosFiltrados.forEach(j => {
                const palpitesDoJogo = cachePalpites.filter(p => p.jogo_id === j.id);
                
                let htmlGerenciarPalpites = '';
                palpitesDoJogo.forEach(p => {
                    let tagDataHora = '';
                    if (p.criado_em) {
                        const d = new Date(p.criado_em);
                        const dia = String(d.getDate()).padStart(2, '0');
                        const mes = String(d.getMonth() + 1).padStart(2, '0');
                        const hora = String(d.getHours()).padStart(2, '0');
                        const min = String(d.getMinutes()).padStart(2, '0');
                        tagDataHora = `<span class="text-[10px] text-slate-500 font-mono">(${dia}/${mes} ${hora}:${min})</span>`;
                    }

                    htmlGerenciarPalpites += `
                        <div class="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-850 gap-2">
                            <div class="flex items-center gap-1.5 min-w-0 truncate">
                                <span class="text-slate-300 font-bold truncate">${p.nome_apostador} ${tagDataHora}</span>
                                <span class="text-slate-500 font-mono shrink-0">(${p.palpite_a}×${p.palpite_b})</span>
                            </div>
                            <button onclick="deletarPalpite('${p.id}')" class="text-[10px] bg-red-950 text-red-400 border border-red-900/40 px-2.5 py-1 rounded-md font-bold hover:bg-red-900 hover:text-white transition shrink-0">Apagar</button>
                        </div>
                    `;
                });

                const totalInscricoes = palpitesDoJogo.length;
                const caixaBruto = totalInscricoes * 5.00;
                const seuLucro = caixaBruto * 0.10;

                let infoLucroAdmin = '';
                let botaoCompartilharWhats = '';
                if(j.encerrado) {
                    infoLucroAdmin = `<span class="text-[10px] text-amber-400 font-black uppercase tracking-wider block mt-1">💰 Seu Lucro Líquido (10%): R$ ${seuLucro.toFixed(2)}</span>`;
                    botaoCompartilharWhats = `<button onclick="compartilharResultadoWhats('${j.id}', '${j.time_a}', '${j.time_b}', ${j.gols_a}, ${j.gols_b})" class="text-[10px] bg-emerald-950 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-900/40 px-2.5 py-0.5 rounded-md font-bold transition">🟢 Copiar Resumo p/ Whats</button>`;
                }

                adminDiv.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-xl space-y-4">
                        
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800/60 pb-3 gap-2">
                            <div>
                                <h3 class="text-sm font-black text-white uppercase tracking-tight">${j.time_a} × ${j.time_b}</h3>
                                <span class="text-[10px] text-slate-500 font-bold uppercase tracking-wider block">Total de Inscrições: ${totalInscricoes} (R$ ${caixaBruto.toFixed(2)})</span>
                                ${infoLucroAdmin}
                            </div>
                            <div class="flex items-center gap-2 self-start sm:self-center flex-wrap">
                                ${botaoCompartilharWhats}
                                <button onclick="excluirJogoCompleto('${j.id}', '${j.time_a}', '${j.time_b}')" class="text-[10px] bg-rose-950/40 text-rose-400 hover:bg-rose-900 hover:text-white border border-rose-900/40 px-2 py-0.5 rounded-md font-bold transition">🗑️ Excluir</button>
                                <span class="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md ${j.encerrado ? 'bg-slate-950 text-slate-500 border border-slate-800' : 'bg-green-500/10 text-green-400 border border-green-500/20'}">
                                    ${j.encerrado ? 'Finalizado' : 'Aberto'}
                                </span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div class="space-y-3">
                                <h4 class="text-[11px] font-bold text-green-400 uppercase tracking-wider">📥 Inserir Entrada do Whats</h4>
                                <div class="flex gap-1.5 items-center">
                                    <input type="text" id="whats-nome-${j.id}" placeholder="Nome" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs flex-1 text-white focus:outline-none min-w-0" ${j.encerrado ? 'disabled' : ''}>
                                    <input type="number" min="0" id="whats-pal-a-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs w-11 text-center text-white focus:outline-none shrink-0" ${j.encerrado ? 'disabled' : ''}>
                                    <span class="text-xs text-slate-600 shrink-0">×</span>
                                    <input type="number" min="0" id="whats-pal-b-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs w-11 text-center text-white focus:outline-none shrink-0" ${j.encerrado ? 'disabled' : ''}>
                                    <button onclick="salvarPalpiteWhats('${j.id}')" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider transition shrink-0" ${j.encerrado ? 'disabled' : ''}>Salvar</button>
                                </div>
                                
                                <div class="space-y-1.5 mt-2">
                                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Auditoria/Exclusão de Palpites:</span>
                                    <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                                        ${htmlGerenciarPalpites || '<span class="text-xs text-slate-600 italic">Nenhum palpite lançado.</span>'}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="border-t md:border-t-0 md:border-l border-slate-800/80 pt-4 md:pt-0 md:pl-5 flex flex-col justify-center space-y-2">
                                <h4 class="text-[11px] font-bold text-amber-400 uppercase tracking-wider">🏁 Liquidar e Fechar Mercado</h4>
                                ${j.encerrado ? 
                                    `<div class="space-y-2">
                                        <div class="bg-slate-950 p-3 rounded-xl border border-slate-850 text-center">
                                            <p class="text-xs text-slate-400">Placar homologado: <strong class="text-white">${j.gols_a} × ${j.gols_b}</strong></p>
                                        </div>
                                        <button onclick="reabrirJogo('${j.id}')" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 p-2 rounded-xl text-xs font-bold uppercase tracking-wider transition">⚠️ Errei o Placar / Reabrir Bolão</button>
                                    </div>` : 
                                    `<div class="flex gap-2 items-center">
                                        <input type="number" min="0" id="res-a-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs w-14 text-center text-white focus:outline-none shrink-0">
                                        <span class="text-xs text-slate-600 shrink-0">×</span>
                                        <input type="number" min="0" id="res-b-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs w-14 text-center text-white focus:outline-none shrink-0">
                                        <button onclick="encerrarJogo('${j.id}')" class="bg-red-600 hover:bg-red-500 text-white p-2.5 rounded-xl text-xs font-bold uppercase tracking-wider flex-1 h-9 transition">Fechar e Ratear</button>
                                    </div>`
                                }
                            </div>
                        </div>
                    </div>
                `;

                // Devolve os valores para os inputs após redesenhar a tela
                if (valoresPreenchidos[j.id]) {
                    document.getElementById(`whats-nome-${j.id}`).value = valoresPreenchidos[j.id].nome;
                    document.getElementById(`whats-pal-a-${j.id}`).value = valoresPreenchidos[j.id].palA;
                    document.getElementById(`whats-pal-b-${j.id}`).value = valoresPreenchidos[j.id].palB;
                }
            });
        }

        async function compartilharResultadoWhats(jogoId, timeA, timeB, golsA, golsB) {
            const { data: ganhadores } = await _supabase.from('ganhadores_jogos').select('nome_ganhador').eq('jogo_id', jogoId);
            const palpitesDoJogo = cachePalpites.filter(p => p.jogo_id === jogoId);
            const totalArrecadado = palpitesDoJogo.length * 5.00;
            const premioLiquido = totalArrecadado * 0.90;

            let texto = `🏁 *BOLÃO DO JACIM - RESULTADO* 🏁\n\n⚽ *${timeA} ${golsA} × ${golsB} ${timeB}*\n\n🏆 *GANHADORES DA RODADA:*`;
            if (ganhadores && ganhadores.length > 0) {
                const valorCadaUm = premioLiquido / ganhadores.length;
                ganhadores.forEach(g => { texto += `\n👉 *${g.nome_ganhador}* (R$ ${valorCadaUm.toFixed(2)})`; });
            } else {
                texto += `\n❌ Não houve acertadores do placar exato nesta rodada!`;
            }
            navigator.clipboard.writeText(texto);
            alert("📋 Resumo contábil copiado! Só colar no grupo do WhatsApp.");
        }

        async function cadastrarJogo() {
            const timeA = document.getElementById('add-time-a').value.trim();
            const timeB = document.getElementById('add-time-b').value.trim();
            const dataJogo = document.getElementById('add-data').value;
            if(!timeA || !timeB) return alert("Preencha os times!");
            await _supabase.from('jogos').insert([{ time_a: timeA, time_b: timeB, data_jogo: dataJogo || null }]);
            carregarDados();
        }

        async function salvarPalpiteWhats(jogoId) {
            const nome = document.getElementById(`whats-nome-${jogoId}`).value.trim();
            const palA = parseInt(document.getElementById(`whats-pal-a-${jogoId}`).value);
            const palB = parseInt(document.getElementById(`whats-pal-b-${jogoId}`).value);
            if (!nome || isNaN(palA) || isNaN(palB) || palA < 0 || palB < 0) return alert("Dados inválidos!");
            
            await _supabase.from('palpites').insert([{ 
                nome_apostador: nome, 
                jogo_id: jogoId, 
                palpite_a: palA, 
                palpite_b: palB,
                criado_em: new Date().toISOString()
            }]);
            
            document.getElementById(`whats-nome-${jogoId}`).value = '';
            document.getElementById(`whats-pal-a-${jogoId}`).value = '';
            document.getElementById(`whats-pal-b-${jogoId}`).value = '';
            carregarDados();
        }

        async function deletarPalpite(palpiteId) {
            if (!confirm("Tem certeza que deseja apagar esse palpite?")) return;
            await _supabase.from('palpites').delete().eq('id', palpiteId);
            carregarDados();
        }

        async function excluirJogoCompleto(jogoId, timeA, timeB) {
            if (!confirm(`⚠️ Excluir bolão de "${timeA} × ${timeB}"?`)) return;
            await _supabase.from('ganhadores_jogos').delete().eq('jogo_id', jogoId);
            await _supabase.from('palpites').delete().eq('jogo_id', jogoId);
            await _supabase.from('jogos').delete().eq('id', jogoId);
            alert("Bolão excluído!");
            carregarDados();
        }

        async function reabrirJogo(jogoId) {
            if (!confirm("Deseja reabrir o bolão?")) return;
            await _supabase.from('ganhadores_jogos').delete().eq('jogo_id', jogoId);
            await _supabase.from('jogos').update({ encerrado: false, gols_a: null, gols_b: null }).eq('id', jogoId);
            alert("Bolão reaberto!");
            carregarDados();
        }

        async function encerrarJogo(jogoId) {
            const golsA = parseInt(document.getElementById(`res-a-${jogoId}`).value);
            const golsB = parseInt(document.getElementById(`res-b-${jogoId}`).value);
            if (isNaN(golsA) || isNaN(golsB) || golsA < 0 || golsB < 0) return alert("Digite um placar válido!");

            await _supabase.from('jogos').update({ gols_a: golsA, gols_b: golsB, encerrado: true }).eq('id', jogoId);
            const { data: lista } = await _supabase.from('palpites').select('*').eq('jogo_id', jogoId);
            
            if (!lista || lista.length === 0) return carregarDados();

            let cravados = [];
            let tendencia = [];

            lista.forEach(p => {
                const acertouVencedor = (golsA > golsB && p.palpite_a > p.palpite_b) || (golsA < golsB && p.palpite_a < p.palpite_b) || (golsA === golsB && p.palpite_a === p.palpite_b);
                if (p.palpite_a === golsA && p.palpite_b === golsB) cravados.push(p.nome_apostador);
                else if (acertouVencedor) tendencia.push(p.nome_apostador);
            });

            const bruto = lista.length * 5.00;
            const lucroOculto = bruto * 0.10;
            const premioLiquido = bruto - lucroOculto;

            let ganhadoresFinais = cravados.length > 0 ? cravados : tendencia;
            
            for(let nome of ganhadoresFinais) {
                await _supabase.from('ganhadores_jogos').insert([{ jogo_id: jogoId, nome_ganhador: nome }]);
            }

            let resumo = `💸 RELATÓRIO CONTÁBIL DE FECHAMENTO\n\n`;
            resumo += `• Caixa Bruto Arrecadado: R$ ${bruto.toFixed(2)} (${lista.length} entradas)\n`;
            resumo += `• Sua Margem de Operação (10%): R$ ${lucroOculto.toFixed(2)}\n`;
            resumo += `• Dinheiro Líquido para Prêmios (90%): R$ ${premioLiquido.toFixed(2)}\n\n`;
            if (ganhadoresFinais.length > 0) {
                resumo += `💰 FAZER O PIX DA PREMIAÇÃO PARA:\n`;
                ganhadoresFinais.forEach(n => resumo += `👉 ${n}: R$ ${(premioLiquido / ganhadoresFinais.length).toFixed(2)}\n`);
            } else {
                resumo += `Ninguém pontuou. O prêmio de R$ ${premioLiquido.toFixed(2)} está retido.`;
            }
            alert(resumo);
            carregarDados();
        }

        carregarDados();
        setInterval(carregarDados, 10000); // Roda em background de forma segura
    </script>
</body>
</html>
