<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ MEU PAINEL SECRETO — CONTROLE GERAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <main class="max-w-4xl mx-auto space-y-6">
        <div class="bg-red-950/40 border border-red-900 p-4 rounded-xl shadow-lg">
            <h1 class="text-xl font-bold text-red-400">⚙️ Painel do Organizador (Privado)</h1>
            <p class="text-xs text-slate-400 mt-1">Gerencie os jogos e veja o faturamento real das rodadas de R$ 5,00 aqui.</p>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow">
            <h3 class="text-sm font-semibold text-slate-300 mb-2">Cadastrar Novo Jogo:</h3>
            <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
                <input type="text" id="add-time-a" placeholder="Time A" class="bg-slate-950 border border-slate-800 p-2 rounded text-sm text-white">
                <input type="text" id="add-time-b" placeholder="Time B" class="bg-slate-950 border border-slate-800 p-2 rounded text-sm text-white">
                <input type="datetime-local" id="add-data" class="bg-slate-950 border border-slate-800 p-2 rounded text-sm text-white">
                <button onclick="cadastrarJogo()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded text-sm font-medium transition">Criar Bolão</button>
            </div>
        </div>

        <div class="space-y-4">
            <h2 class="text-lg font-bold">Gerenciar Palpites (Whats) e Resultados de Campo</h2>
            <div id="lista-jogos-admin" class="space-y-4"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://vjbjbjdqsjibxfeguger.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IsntZwbiFHOs3RuhFnFs6g_8xA6-z-2";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            const { data: jogos } = await _supabase.from('jogos').select('*').order('data_jogo', { ascending: true });
            const { data: palpites } = await _supabase.from('palpites').select('*');
            if (!jogos || !palpites) return;

            const adminDiv = document.getElementById('lista-jogos-admin');
            adminDiv.innerHTML = '';

            jogos.forEach(j => {
                const palpitesDoJogo = palpites.filter(p => p.jogo_id === j.id);
                adminDiv.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 grid md:grid-cols-2 gap-4 shadow">
                        <div class="space-y-2">
                            <h3 class="text-xs font-bold text-green-400">📝 Inserir Entrada do Whats</h3>
                            <p class="text-sm font-semibold">${j.time_a} x ${j.time_b} (${palpitesDoJogo.length} palpites)</p>
                            <div class="flex gap-2">
                                <input type="text" id="whats-nome-${j.id}" placeholder="Nome do Amigo" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs flex-1 text-white">
                                <input type="number" id="whats-pal-a-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs w-12 text-center text-white">
                                <span class="text-xs self-center">x</span>
                                <input type="number" id="whats-pal-b-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs w-12 text-center text-white">
                                <button onclick="salvarPalpiteWhats('${j.id}')" class="bg-green-600 hover:bg-green-500 p-1.5 rounded text-xs text-white px-3 font-medium">Salvar</button>
                            </div>
                        </div>
                        <div class="space-y-2 border-t md:border-t-0 md:border-l border-slate-800 pt-3 md:pt-0 md:pl-4 flex flex-col justify-center">
                            <h3 class="text-xs font-bold text-yellow-400">🏁 Resultado de Campo Oficial</h3>
                            ${j.encerrado ? 
                                `<p class="text-xs text-slate-400">Encerrado: <strong class="text-white">${j.gols_a} x ${j.gols_b}</strong></p>` : 
                                `<div class="flex gap-2 items-center">
                                    <input type="number" id="res-a-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs w-14 text-center text-white">
                                    <span class="text-xs">x</span>
                                    <input type="number" id="res-b-${j.id}" placeholder="0" class="bg-slate-950 border border-slate-800 p-1.5 rounded text-xs w-14 text-center text-white">
                                    <button onclick="encerrarJogo('${j.id}')" class="bg-red-600 hover:bg-red-500 p-1.5 rounded text-xs text-white font-medium flex-1 h-8">Fechar Bolão</button>
                                </div>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        async function cadastrarJogo() {
            const timeA = document.getElementById('add-time-a').value.trim();
            const timeB = document.getElementById('add-time-b').value.trim();
            const dataJogo = document.getElementById('add-data').value;
            if(!timeA || !timeB) return alert("Preencha os times!");
            await _supabase.from('jogos').insert([{ time_a: timeA, time_b: timeB, data_jogo: dataJogo || null }]);
            carregarDados();
        }

        async function salvarPalpiteWhats(jogoId) {
            const nome = document.getElementById(`whats-nome-${jogoId}`).value.trim();
            const palA = parseInt(document.getElementById(`whats-pal-a-${jogoId}`).value);
            const palB = parseInt(document.getElementById(`whats-pal-b-${jogoId}`).value);
            if (!nome || isNaN(palA) || isNaN(palB)) return alert("Dados incompletos!");
            await _supabase.from('palpites').insert([{ nome_apostador: nome, jogo_id: jogoId, palpite_a: palA, palpite_b: palB }]);
            alert("Salvo!");
            carregarDados();
        }

        async function encerrarJogo(jogoId) {
            const golsA = parseInt(document.getElementById(`res-a-${jogoId}`).value);
            const golsB = parseInt(document.getElementById(`res-b-${jogoId}`).value);
            if (isNaN(golsA) || isNaN(golsB)) return alert("Digite o placar oficial!");

            await _supabase.from('jogos').update({ gols_a: golsA, gols_b: golsB, encerrado: true }).eq('id', jogoId);
            const { data: lista } = await _supabase.from('palpites').select('*').eq('jogo_id', jogoId);
            
            if (!lista || lista.length === 0) return carregarDados();

            let cravados = [];
            let tendencia = [];

            lista.forEach(p => {
                const acertouVencedor = (golsA > golsB && p.palpite_a > p.palpite_b) || (golsA < golsB && p.palpite_a < p.palpite_b) || (golsA === golsB && p.palpite_a === p.palpite_b);
                if (p.palpite_a === golsA && p.palpite_b === golsB) cravados.push(p.nome_apostador);
                else if (acertouVencedor) tendencia.push(p.nome_apostador);
            });

            // Caixa (Comissão de 20% embutida)
            const bruto = lista.length * 5.00;
            const lucroOculto = bruto * 0.20;
            const premioLiquido = bruto - lucroOculto;

            let ganhadoresFinais = cravados.length > 0 ? cravados : tendencia;
            
            // Grava os ganhadores na tabela pública para a galera ver o nome de quem levou
            for(let nome of ganhadoresFinais) {
                await _supabase.from('ganhadores_jogos').insert([{ jogo_id: jogoId, nome_ganhador: nome }]);
            }

            // Alerta financeiro secreto em tela apenas para você
            let resumo = `💸 CONTABILIDADE DE BASTIDORES\n\n`;
            resumo += `• Arrecadado: R$ ${bruto.toFixed(2)} (${lista.length} pessoas)\n`;
            resumo += `• Sua Comissão (20%): R$ ${lucroOculto.toFixed(2)}\n`;
            resumo += `• Prêmio Líquido: R$ ${premioLiquido.toFixed(2)}\n\n`;
            if (ganhadoresFinais.length > 0) {
                resumo += `💰 PAGAR VIA PIX PARA:\n`;
                ganhadoresFinais.forEach(n => resumo += `👉 ${n}: R$ ${(premioLiquido / ganhadoresFinais.length).toFixed(2)}\n`);
            } else {
                resumo += `Acumulou! Ninguém pontuou.`;
            }
            alert(resumo);
            carregarDados();
        }

        carregarDados();
    </script>
</body>
</html>
