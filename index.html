<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão do Jacim - World Cup 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-xl font-bold text-green-400">⚽ Central do Bolão — R$ 5,00 por Jogo</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow">
            <h2 class="text-lg font-semibold mb-2 text-yellow-400">Como participar:</h2>
            <p class="text-sm text-gray-400">Cada jogo é um bolão independente! Mande <strong>R$ 5,00</strong> no Pix por palpite e informe os seus placares no WhatsApp do organizador. Quem acertar leva a bolada do jogo!</p>
        </div>

        <div>
            <h2 class="text-xl font-bold mb-4">🏟️ Bolões e Resultados</h2>
            <div id="lista-jogos-publico" class="grid gap-4 md:grid-cols-2">
                </div>
        </div>

    </main>

    <script>
        // CONFIGURAÇÕES DO SUPABASE (IGUAL NAS DUAS TELAS)
        const SUPABASE_URL = "https://seu-projeto.supabase.co"; 
        const SUPABASE_KEY = "sua-anon-key-aqui";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            const { data: jogos } = await _supabase.from('jogos').select('*').order('data_jogo', { ascending: true });
            const { data: palpites } = await _supabase.from('palpites').select('*');
            const { data: ganhadores } = await _supabase.from('ganhadores_jogos').select('*'); // Tabela auxiliar de ganhadores
            
            if (!jogos || !palpites) return;

            const listaDiv = document.getElementById('lista-jogos-publico');
            listaDiv.innerHTML = '';

            jogos.forEach(j => {
                const palpitesDoJogo = palpites.filter(p => p.jogo_id === j.id);
                const ganhadoresDesteJogo = ganhadores ? ganhadores.filter(g => g.jogo_id === j.id) : [];
                
                let htmlPalpites = '';
                palpitesDoJogo.forEach(p => {
                    htmlPalpites += `
                        <div class="flex justify-between items-center text-xs bg-gray-900 p-2 rounded border border-gray-750">
                            <span class="text-gray-300 font-medium">${p.nome_apostador}</span>
                            <span class="bg-gray-750 px-2 py-0.5 rounded text-yellow-400 font-mono">${p.palpite_a} x ${p.palpite_b}</span>
                        </div>
                    `;
                });

                let htmlGanhadores = '';
                if (j.encerrado) {
                    if (ganhadoresDesteJogo.length > 0) {
                        htmlGanhadores = `
                            <div class="mt-3 bg-green-950/40 border border-green-800 p-2 rounded-lg">
                                <span class="text-xs font-bold text-green-400 block mb-1">🏆 Ganhadores do Bolão:</span>
                                <p class="text-xs text-green-300 font-medium">${ganhadoresDesteJogo.map(g => g.nome_ganhador).join(', ')}</p>
                            </div>
                        `;
                    } else {
                        htmlGanhadores = `<div class="mt-3 bg-gray-850 border border-gray-750 p-2 rounded-lg text-xs text-gray-400 italic">Ninguém acertou os critérios. Prêmio acumulado!</div>`;
                    }
                }

                listaDiv.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col justify-between shadow">
                        <div>
                            <div class="flex justify-between text-xs text-gray-400 mb-2">
                                <span>${j.data_jogo ? new Date(j.data_jogo).toLocaleDateString('pt-BR') : 'A definir'}</span>
                                <span class="${j.encerrado ? 'text-red-400 font-bold' : 'text-green-400'}">${j.encerrado ? 'Encerrado' : 'Aberto'}</span>
                            </div>
                            <div class="flex justify-center items-center gap-3 text-center my-3">
                                <span class="font-bold flex-1 text-right">${j.time_a}</span>
                                <span class="bg-gray-900 px-3 py-1 rounded font-mono text-lg font-bold text-green-400">
                                    ${j.encerrado ? `${j.gols_a} x ${j.gols_b}` : 'vs'}
                                </span>
                                <span class="font-bold flex-1 text-left">${j.time_b}</span>
                            </div>
                        </div>
                        ${htmlGanhadores}
                        <div class="mt-4 border-t border-gray-700 pt-3 space-y-1.5">
                            <h4 class="text-xs font-semibold text-gray-400">Palpites Confirmados (${palpitesDoJogo.length}):</h4>
                            <div class="grid gap-1 max-h-32 overflow-y-auto pr-1">
                                ${htmlPalpites || '<p class="text-xs text-gray-500 italic">Nenhum palpite ainda.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        carregarDados();
        setInterval(carregarDados, 15000); // Atualiza sozinho a cada 15 segundos
    </script>
</body>
</html>
