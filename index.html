<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Adega 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen dynamic-scroll antialiased selection:bg-green-500 selection:text-slate-950">

    <header class="bg-slate-900/80 border-b border-slate-800/80 backdrop-blur-md p-4 sticky top-0 z-50 shadow-lg shadow-slate-950/20">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <span class="text-2xl">🏆</span>
                <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-green-400 to-emerald-500 bg-clip-text text-transparent uppercase">Bolão Jacim</h1>
            </div>
            <span class="text-xs font-bold bg-green-500/10 text-green-400 px-3 py-1 rounded-full border border-green-500/20 shadow-inner">R$ 5,00 por Jogo</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-8 mt-4">
        
        <div class="bg-gradient-to-br from-slate-900 to-slate-900/60 p-5 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden group flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="absolute -right-10 -top-10 text-8xl opacity-5 group-hover:scale-110 transition duration-500 pointer-events-none">⚽</div>
            <div class="max-w-2xl">
                <h2 class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-1.5">Como Funciona o Jogo?</h2>
                <p class="text-sm text-slate-400 leading-relaxed">Cada partida funciona como um bolão único e independente. Faça o Pix de <strong>R$ 5,00</strong> por palpite e envie o seu placar clicando no botão ao lado. Quem acertar leva a premiação da rodada!</p>
            </div>
            <div class="flex shrink-0">
                <a href="https://wa.me/5588997263753?text=Fala%20Jacim,%20quero%20mandar%20um%20palpite%20para%20o%20bol%C3%A3o%20da%20Copa!" 
                   target="_blank" 
                   class="w-full md:w-auto bg-green-600 hover:bg-green-500 text-white font-bold text-xs uppercase tracking-wider px-5 py-3 rounded-xl shadow-lg border border-green-500/30 flex items-center justify-center gap-2 transition duration-200 hover:scale-[1.02] active:scale-[0.98]">
                    <span>💬</span> Enviar Palpite no Whats
                </a>
            </div>
        </div>

        <div class="space-y-4">
            <h2 class="text-md font-bold tracking-wider text-slate-400 uppercase flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Partidas e Palpites Cadastrados
            </h2>
            <div id="lista-jogos-publico" class="grid gap-5 md:grid-cols-2">
                </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://vjbjbjdqsjibxfeguger.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_IsntZwbiFHOs3RuhFnFs6g_8xA6-z-2"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarDados() {
            const { data: jogos } = await _supabase.from('jogos').select('*').order('data_jogo', { ascending: true });
            const { data: palpites } = await _supabase.from('palpites').select('*');
            const { data: ganhadores } = await _supabase.from('ganhadores_jogos').select('*');
            
            if (!jogos || !palpites) return;

            const listaDiv = document.getElementById('lista-jogos-publico');
            listaDiv.innerHTML = '';

            jogos.forEach(j => {
                const palpitesDoJogo = palpites.filter(p => p.jogo_id === j.id);
                const ganhadoresDesteJogo = ganhadores ? ganhadores.filter(g => g.jogo_id === j.id) : [];
                
                let htmlPalpites = '';
                palpitesDoJogo.forEach(p => {
                    htmlPalpites += `
                        <div class="flex justify-between items-center text-xs bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/40">
                            <span class="text-slate-300 font-medium">${p.nome_apostador}</span>
                            <span class="bg-slate-800 text-amber-400 font-mono font-bold px-2 py-0.5 rounded-md border border-slate-700/60 shadow-sm">${p.palpite_a} × ${p.palpite_b}</span>
                        </div>
                    `;
                });

                let htmlGanhadores = '';
                if (j.encerrado) {
                    if (ganhadoresDesteJogo.length > 0) {
                        const totalArrecadado = palpitesDoJogo.length * 5.00;
                        const premioLiquido = totalArrecadado * 0.80; 
                        const valorCadaUm = premioLiquido / ganhadoresDesteJogo.length;

                        const textoGanhadores = ganhadoresDesteJogo.map(g => `${g.nome_ganhador} (Recebe: R$ ${valorCadaUm.toFixed(2)})`).join(', ');

                        htmlGanhadores = `
                            <div class="mt-3.5 bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl flex items-start gap-2">
                                <span class="text-base mt-0.5">🏆</span>
                                <div>
                                    <span class="text-[11px] font-bold text-emerald-400 block uppercase tracking-wider">Premiação do Vencedor:</span>
                                    <p class="text-xs text-emerald-300 font-semibold mt-0.5">${textoGanhadores}</p>
                                </div>
                            </div>
                        `;
                    } else {
                        htmlGanhadores = `
                            <div class="mt-3.5 bg-slate-800/40 border border-slate-700/40 p-3 rounded-xl text-xs text-slate-400 italic flex items-center gap-2">
                                <span>🔒</span> Bolão encerrado sem vencedor!
                            </div>
                        `;
                    }
                }

                const dataFormatada = j.data_jogo ? new Date(j.data_jogo).toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}) : '--/--';
                const horaFormatada = j.data_jogo ? new Date(j.data_jogo).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}) : '--:--';

                listaDiv.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg relative overflow-hidden transition duration-300 hover:border-slate-700">
                        <div>
                            <div class="flex justify-between items-center text-[11px] text-slate-500 font-bold uppercase tracking-wider mb-4">
                                <div class="flex items-center gap-1.5">
                                    <span>📅 ${dataFormatada}</span>
                                    <span>⏰ ${horaFormatada}</span>
                                </div>
                                <span class="${j.encerrado ? 'text-rose-500 bg-rose-500/10 px-2 py-0.5 rounded-md border border-rose-500/20' : 'text-green-400 bg-green-500/10 px-2 py-0.5 rounded-md border border-green-500/20'}">
                                    ${j.encerrado ? 'Finalizado' : 'Aberto'}
                                </span>
                            </div>
                            <div class="flex justify-between items-center gap-4 my-2">
                                <span class="font-extrabold text-sm text-right flex-1 tracking-tight truncate">${j.time_a}</span>
                                <div class="bg-slate-950 px-4 py-2 rounded-xl font-mono text-base font-black text-green-400 border border-slate-800 shadow-inner min-w-[70px] text-center">
                                    ${j.encerrado ? `${j.gols_a} - ${j.gols_b}` : 'VS'}
                                </div>
                                <span class="font-extrabold text-sm text-left flex-1 tracking-tight truncate">${j.time_b}</span>
                            </div>
                        </div>
                        ${htmlGanhadores}
                        <div class="mt-5 border-t border-slate-800/80 pt-4 space-y-2">
                            <div class="flex justify-between items-center">
                                <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Palpites Registrados</h4>
                            </div>
                            <div class="grid gap-1.5 max-h-36 overflow-y-auto pr-1">
                                ${htmlPalpites || '<p class="text-xs text-slate-600 italic py-1">Nenhum palpite computado.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        carregarDados();
        setInterval(carregarDados, 10000); 
    </script>
</body>
</html>
